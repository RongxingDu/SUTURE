extends: deepseek_v4_flash.yaml

name: math_deepseek_v4_flash_pilot20
# Chosen by prepare_aflow_pilots.py so optimization/validation use only
# AFlow-validation rows and held-out test uses only AFlow-test rows.
seed: 20386949
early_stopping_patience: 2
early_stopping_min_delta: 0.02
# Stability gates selected from the persisted-pilot sensitivity grid. A local
# counterfactual win must survive two full optimization-split confirmations
# and then improve validation utility without reducing hard reward.
validation_min_delta: 0.02
validation_hard_regression_tolerance: 0.0
confirm_on_opt: true
confirm_repeats: 2

reward:
  alpha_process: 0.4

scheduler:
  scheduler_type: fixed
  max_actions_per_query: 8
  allow_deviation: false
  system_prompt: |
    You are a math workflow scheduler. Preserve required data dependencies.
    Prefer early exit only when a complete boxed answer already exists.

optimizer:
  workflow_content_only: true
  max_rounds: 2
  failure_buffer_capacity: 3
  success_guard_fraction: 0.25
  min_success_guards: 1
  candidates_per_round: 3
  max_edit_distance: 0.5
  lambda_cost: 0.00005
  lambda_latency: 0.01
  lambda_api_cost: 0.0
  rho_omega: 0.001
  mu_edit: 0.02
  epsilon_stat: 0.02
  use_suffix_replay: true
  require_failure_suffix_replay: true

executor:
  max_steps: 8
  timeout_per_step: 180.0
  trace_enabled: true
