# Shared DeepSeek V4 Flash backend for real API experiments.
# Temporary research configuration: the DeepSeek key is hardcoded as requested.
extends: default.yaml

output_dir: experiments/results/deepseek_v4_flash

scheduler:
  llm:
    provider: deepseek
    model: deepseek-v4-flash
    api_key: ${OPENAI_API_KEY}
    api_base: https://api.deepseek.com
    temperature: 0.0
    max_tokens: 2048
    max_retries: 1
    timeout_seconds: 180.0
    # Keep workflow execution and scheduling in non-thinking mode so hidden
    # reasoning does not dominate the token/latency comparison.
    extra_kwargs:
      extra_body:
        thinking:
          type: disabled

optimizer:
  allowed_execution_models:
    - deepseek-v4-flash
  llm:
    provider: deepseek
    model: deepseek-v4-flash
    api_key: ${OPENAI_API_KEY}
    api_base: https://api.deepseek.com
    temperature: 0.0
    max_tokens: 2048
    max_retries: 1
    timeout_seconds: 180.0
    # The optimizer has fewer calls and benefits from deliberate diagnosis.
    extra_kwargs:
      reasoning_effort: high
      extra_body:
        thinking:
          type: enabled
