# Shared Aliyun DashScope Qwen3.5-Flash backend for real API experiments.
# Temporary research configuration: the Aliyun key is hardcoded as requested.
extends: default.yaml

output_dir: experiments/results/aliyun_qwen35

scheduler:
  llm:
    provider: aliyun
    model: qwen3.5-flash-2026-02-23
    api_key: ${OPENAI_API_KEY}
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    temperature: 0.0
    max_tokens: 2048
    max_retries: 1
    timeout_seconds: 180.0
    # Execution keeps the model's native reasoning disabled so per-query
    # latency/token cost stays bounded; reasoning_tokens would otherwise be
    # charged on every workflow node call.
    extra_kwargs:
      extra_body:
        enable_thinking: false

optimizer:
  allowed_execution_models:
    - qwen3.5-flash-2026-02-23
  llm:
    provider: aliyun
    model: qwen3.5-flash-2026-02-23
    api_key: ${OPENAI_API_KEY}
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    temperature: 0.0
    max_tokens: 2048
    max_retries: 1
    timeout_seconds: 180.0
