name: agent_task_v1
description: "Default agent task workflow: plan -> execute -> observe -> reflect -> respond"
version: "1.0"
entry_node: start

nodes:
  start:
    node_id: start
    node_type: start
    label: "Start"

  plan:
    node_id: plan
    node_type: llm
    label: "Plan Actions"
    config:
      node_type: llm
      system_prompt: "You are an AI agent. Plan actions to accomplish the given task."
      prompt_template: |
        Task:
        {query}

        Create a plan to accomplish this task. List the steps and any tools you need.

  execute:
    node_id: execute
    node_type: tool
    label: "Execute Tool"
    config:
      node_type: tool
      tool_name: execute_action

  observe:
    node_id: observe
    node_type: llm
    label: "Observe Results"
    config:
      node_type: llm
      system_prompt: "You are an AI agent. Analyze the results of your actions."
      prompt_template: |
        Task:
        {query}

        Action result:
        {execute_output}

        Analyze the result. Was the action successful? What did you learn?

  reflect:
    node_id: reflect
    node_type: llm
    label: "Reflect and Replan"
    config:
      node_type: llm
      system_prompt: "You are an AI agent. Reflect on progress and decide next steps."
      prompt_template: |
        Task:
        {query}

        Progress so far:
        Plan: {plan_output}
        Last action result: {execute_output}
        Observation: {observe_output}

        Should you:
        1. Continue with the next planned step?
        2. Replan based on what you've learned?
        3. Respond with the final answer?

        If the task is complete, provide the final answer.
        If not, indicate what to do next.

  respond:
    node_id: respond
    node_type: llm
    label: "Final Response"
    config:
      node_type: llm
      system_prompt: "You are an AI agent. Provide a clear final response to the user."
      prompt_template: |
        Task:
        {query}

        Results and reasoning:
        {reflect_output}

        Provide the final answer to the user.

  end:
    node_id: end
    node_type: end
    label: "End"

edges:
  - ["start", "plan"]
  - ["plan", "execute"]
  - ["execute", "observe"]
  - ["observe", "reflect"]
  - ["reflect", "respond"]
  - ["respond", "end"]

parameters:
  stages:
    act:
      stage_id: act
      label: "Plan and act"
      blocks:
        execution:
          block_id: execution
          label: "Plan, execute, and observe"
          operators:
            plan:
              node_id: plan
              prompt:
                system_prompt: "You are an AI agent. Plan actions to accomplish the given task."
                user_template: |
                  Task:
                  {query}

                  Create a plan to accomplish this task. List the steps and any tools you need.
            execute:
              node_id: execute
              tool_name: execute_action
            observe:
              node_id: observe
              prompt:
                system_prompt: "You are an AI agent. Analyze the results of your actions."
                user_template: |
                  Task:
                  {query}

                  Action result:
                  {execute_output}

                  Analyze the result. Was the action successful? What did you learn?
        synthesis:
          block_id: synthesis
          label: "Reflect and respond"
          operators:
            reflect:
              node_id: reflect
              prompt:
                system_prompt: "You are an AI agent. Reflect on progress and decide next steps."
                user_template: |
                  Task:
                  {query}

                  Progress so far:
                  Plan: {plan_output}
                  Last action result: {execute_output}
                  Observation: {observe_output}

                  Should you:
                  1. Continue with the next planned step?
                  2. Replan based on what you've learned?
                  3. Respond with the final answer?

                  If the task is complete, provide the final answer.
                  If not, indicate what to do next.
            respond:
              node_id: respond
              prompt:
                system_prompt: "You are an AI agent. Provide a clear final response to the user."
                user_template: |
                  Task:
                  {query}

                  Results and reasoning:
                  {reflect_output}

                  Provide the final answer to the user.
  global_params: {}
